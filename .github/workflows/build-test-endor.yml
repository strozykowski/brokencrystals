name: "Build & Test BrokenCrystals for Endor Demo env"
on:
  workflow_dispatch:
  pull_request:
  
jobs:
  build-test-project:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      pull-requests: write # Required to automatically comment on PRs for new policy violations
      issues: write # Required to comment on PRs for new policy violations
    services:
      docker:
        image: docker:dind
        options: --privileged --shm-size=2g
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
    steps:
      - name: Cleanout
        run: |
          rm -Rf *
      - name: Prepare scan output directory
        run: |
          mkdir -p ${{ github.workspace }}/scan-output
          mkdir -p ${{ github.workspace }}/code

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ${{ github.workspace }}/code
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
      - name: Install npm project dependencies
        working-directory: code/
        run: |
          npm install
      - name: Build npm project
        working-directory: code/
        run: |
          npm run build
      - name: Install NPM SBOM Generator
        working-directory: code/
        run: |
          npm install sbom

      - name: Run NPM SBOM Generator
        working-directory: code/
        run: |
          npm sbom --sbom-format=cyclonedx > sbom.json
          
      - name: Endor Labs Scan Pull Request
        uses: endorlabs/github-action@b8992820cc4d9c9e7ded5022adf6cabe2dc11946 # v1.1.12
        with:
          path: ${{ github.workspace }}/code
          namespace: 'ben-demo' # Replace with your Endor Labs tenant namespace
          scan_dependencies: true
          scan_secrets: true
          pr: false
          github_token: ${{ secrets.GITHUB_TOKEN }} # Requi
          api_key: ${{ secrets.ENDOR_API_CREDENTIALS_KEY }}
          api_secret: ${{ secrets.ENDOR_API_CREDENTIALS_SECRET }}
          enable_github_action_token: false
